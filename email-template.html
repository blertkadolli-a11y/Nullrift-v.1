<!--
  NULLRIFT — Supabase "Magic Link" email template

  Where this goes — TWO templates, same HTML in both:

    Supabase dashboard → Authentication → Emails →
      1. "Magic Link"      → Message body
      2. "Confirm signup"  → Message body

  Delete whatever is in each box, paste this, Save.

  Why both: /auth/v1/otp picks the template by whether the address already has
  an account. An existing account gets "Magic Link"; a first-time visitor gets
  "Confirm signup". Editing only one means it works for you and not for new
  people, or the reverse.

  The important line is {{ .Token }} — that is the six-digit code the sign-in
  page asks for. Supabase's default template only contains the link, which is
  why a code never arrived.

  The link is kept underneath as a fallback. For it to work, Supabase →
  Authentication → URL Configuration → Redirect URLs must contain the address
  of the sign-in page, e.g.
      http://localhost:8155/auth.html
      https://nullrift2-0.vercel.app/auth.html
  The code needs none of that, which is why it is the primary path.
-->

<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#0c0e14;">

  <p style="margin:0 0 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#6b7280;">
    NULLRIFT
  </p>

  <h1 style="margin:0 0 16px;font-size:24px;font-weight:700;letter-spacing:-0.02em;">
    Your sign-in code
  </h1>

  <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4a5261;">
    Enter this code on the sign-in page:
  </p>

  <p style="margin:0 0 24px;padding:18px 20px;background:#f1f3f7;border-radius:10px;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:30px;font-weight:700;letter-spacing:10px;text-align:center;color:#0c0e14;">
    {{ .Token }}
  </p>

  <p style="margin:0 0 28px;font-size:14px;line-height:1.6;color:#6b7280;">
    It expires in one hour. If you didn't ask to sign in, you can ignore this
    email — nothing has changed on your account.
  </p>

  <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">
    Or sign in directly:
  </p>
  <p style="margin:0;font-size:14px;">
    <a href="{{ .ConfirmationURL }}" style="color:#4f46e5;">Sign in to NULLRIFT</a>
  </p>

</div>
