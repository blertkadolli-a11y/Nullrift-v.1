<!--
  NULLRIFT — Supabase "Reset Password" template

  Supabase → Authentication → Emails → Reset Password → Message body.
  Subject: Reset your NULLRIFT password

  The "Forgot password?" screen asks for {{ .Token }}; the link lands on the
  "choose a new password" screen. Either works.
-->

<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#0c0e14;">

  <p style="margin:0 0 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#6b7280;">
    NULLRIFT
  </p>

  <h1 style="margin:0 0 16px;font-size:24px;font-weight:700;letter-spacing:-0.02em;">
    Reset your password
  </h1>

  <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4a5261;">
    Enter this code on the reset screen to choose a new password:
  </p>

  <p style="margin:0 0 24px;padding:18px 20px;background:#f1f3f7;border-radius:10px;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:30px;font-weight:700;letter-spacing:10px;text-align:center;color:#0c0e14;">
    {{ .Token }}
  </p>

  <p style="margin:0 0 28px;font-size:14px;line-height:1.6;color:#6b7280;">
    It expires in one hour. If you didn't ask to reset your password, ignore
    this email — your password has not changed.
  </p>

  <p style="margin:0 0 8px;font-size:13px;color:#6b7280;">
    Or use this link:
  </p>
  <p style="margin:0;font-size:14px;">
    <a href="{{ .ConfirmationURL }}" style="color:#4f46e5;">Choose a new password</a>
  </p>

</div>
